name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Remote-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK (Signed with debug key)
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Remote-Release
          path: app/build/outputs/apk/release/app-release.apk
